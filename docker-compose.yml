
services:
  postgres:
    image: postgres:15-alpine
    container_name: sg-postgres
    environment:
      POSTGRES_DB: school_guardian
      POSTGRES_USER: sguser
      POSTGRES_PASSWORD: sgpassword123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sguser -d school_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend-csharp
      dockerfile: Dockerfile
    container_name: sg-backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - ./tai-lieu:/app/uploads
      - dp_keys:/root/.aspnet/DataProtection-Keys
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=school_guardian;Username=sguser;Password=sgpassword123;Port=5432"
      Redis__ConnectionString: "redis:6379"
      Jwt__Secret: "school-guardian-jwt-secret-key-2024"
      Jwt__RefreshSecret: "school-guardian-refresh-secret-key-2024"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:3000"
      AiService__Url: "http://ai-service:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-training
      dockerfile: Dockerfile
    container_name: sg-ai
    ports:
      - "5000:5000"
    volumes:
      - ./ai-training:/app
      - ./tai-lieu:/tai-lieu
      - ai_cache:/root/.cache
    environment:
      - UPLOAD_DIR=/tai-lieu
      - WHISPER_MODEL_SIZE=small
      - GROQ_API_KEY=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
    restart: unless-stopped

volumes:
  pg_data:
  dp_keys:
  ai_cache:
