; Cấu hình PlatformIO cho ESP32-S3 loại N16R8
; N16R8 = 16MB Flash, 8MB Octal PSRAM

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    johnosbb/MicroTFLite @ ^1.0.4

; ----- Cấu hình bộ nhớ đúng cho N16R8 (Octal PSRAM) -----
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ----- Tốc độ nạp code & giao tiếp Serial -----
upload_speed = 460800
monitor_speed = 115200
; upload_port = COM4
; monitor_port = COM4

; Bật PSRAM Octal (OPI) cho N16R8
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    -DNDEBUG

; Quan trọng: chỉ định đúng loại PSRAM Octal cho S3
board_build.arduino.memory_type = qio_opi
