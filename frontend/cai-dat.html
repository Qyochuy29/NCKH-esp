<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt — SafeVoice AI</title>
  <link rel="stylesheet" href="./giao-dien.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content">

      <div class="card">
        <div class="card-header"><h3>⚙️ Cài đặt hệ thống</h3></div>
        <div class="card-body">

          <div class="settings-section">
            <h3>🎯 Ngưỡng confidence tối thiểu</h3>
            <div class="setting-row">
              <div>
                <div class="setting-label">Ngưỡng tạo cảnh báo</div>
                <div class="setting-desc">Chỉ tạo cảnh báo khi AI nhận diện với confidence ≥ giá trị này</div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                <input type="range" id="confidence-slider" min="50" max="99" value="70" oninput="document.getElementById('confidence-val').textContent=this.value+'%'">
                <span id="confidence-val" style="font-weight:700;min-width:40px;">70%</span>
              </div>
            </div>
          </div>


          <div class="settings-section">
            <h3>🗑️ Lưu trữ audio</h3>
            <div class="setting-row">
              <div>
                <div class="setting-label">Thời gian lưu trữ</div>
                <div class="setting-desc">Tự động xoá file audio sau số ngày này (trừ bằng chứng)</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <input type="number" class="form-control" id="retention-days" min="7" max="365" value="30" style="width:80px;">
                <span>ngày</span>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3>🤖 Trình giả lập sự cố (Demo)</h3>
            <div class="setting-row">
              <div>
                <div class="setting-label">Tự động phát sinh cảnh báo</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <label class="switch">
                  <input type="checkbox" id="simulator-enabled">
                  <span class="switch-slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div style="margin-top:24px;">
            <button class="btn btn-primary" onclick="saveSettings()">💾 Lưu cài đặt</button>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="./dung-chung.js?v=8"></script>
  <script src="./cai-dat.js"></script>
</body>
</html>
