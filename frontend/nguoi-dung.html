<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng — SafeVoice AI</title>
  <link rel="stylesheet" href="./giao-dien.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="font-size:16px;">👥 Quản lý tài khoản người dùng</h3>
        <button class="btn btn-primary" onclick="showAddUser()">+ Thêm người dùng</button>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Họ tên</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Ngày tạo</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          <div id="pagination-users"></div>
        </div>
      </div>

      <!-- Add/Edit Modal -->
      <div class="modal-overlay" id="user-modal">
        <div class="modal">
          <div class="modal-header">
            <h3 id="user-modal-title">Thêm người dùng</h3>
            <button class="modal-close" onclick="closeUserModal()">✕</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="user-id">
            <div class="form-group">
              <label>Họ tên</label>
              <input type="text" class="form-control" id="user-name" placeholder="Nguyễn Văn A">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" id="user-email" placeholder="email@gmail.com">
            </div>
            <div class="form-group">
              <label>Mật khẩu <span id="pw-hint" style="color:var(--text-muted);font-weight:normal;">(để trống nếu không đổi)</span></label>
              <input type="password" class="form-control" id="user-password" placeholder="Mật khẩu mới">
            </div>
            <div class="form-group">
              <label>Vai trò</label>
              <select class="form-control" id="user-role">
                <option value="admin">Quản trị viên</option>
                <option value="ban_giam_hieu">Ban giám hiệu</option>
                <option value="giam_thi">Giám thị</option>
                <option value="bao_ve">Bảo vệ</option>
                <option value="phu_huynh">Phụ huynh</option>
              </select>
            </div>
            <div class="form-group" id="classroom-group" style="display:none;">
              <label>Lớp học (Dành cho Phụ huynh)</label>
              <select class="form-control" id="user-classroom">
                <option value="">-- Chọn lớp học --</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeUserModal()">Huỷ</button>
            <button class="btn btn-primary" onclick="saveUser()">Lưu</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="./dung-chung.js?v=8"></script>
  <script src="./nguoi-dung.js"></script>
</body>
</html>
