<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan — SafeVoice AI</title>
  <meta name="description" content="Dashboard tổng quan giám sát an ninh trường học">
  <link rel="stylesheet" href="./giao-dien.css">
  <script src="/vendor/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content" id="page-content">

      <!-- KPI Cards -->
      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card blue">
          <div class="kpi-header">
            <span class="kpi-label">Thiết bị hoạt động</span>
            <div class="kpi-icon"><i class="bi bi-mic"></i></div>
          </div>
          <div class="kpi-value" id="kpi-devices">--</div>
          <div class="kpi-sub" id="kpi-devices-sub"></div>
        </div>
        <div class="kpi-card red">
          <div class="kpi-header">
            <span class="kpi-label">Cảnh báo hôm nay</span>
            <div class="kpi-icon"><i class="bi bi-exclamation-triangle"></i></div>
          </div>
          <div class="kpi-value" id="kpi-alerts">--</div>
          <div class="kpi-sub">Tính từ 00:00</div>
        </div>
        <div class="kpi-card yellow">
          <div class="kpi-header">
            <span class="kpi-label">Khẩn cấp chưa xử lý</span>
            <div class="kpi-icon"><i class="bi bi-exclamation-circle"></i></div>
          </div>
          <div class="kpi-value" id="kpi-urgent">--</div>
          <div class="kpi-sub">Confidence ≥ 80%</div>
        </div>
        <div class="kpi-card green">
          <div class="kpi-header">
            <span class="kpi-label">TG phản hồi TB</span>
            <div class="kpi-icon"><i class="bi bi-stopwatch"></i></div>
          </div>
          <div class="kpi-value" id="kpi-response">--</div>
          <div class="kpi-sub">7 ngày gần nhất</div>
        </div>
      </div>

      <div class="grid-2">
        <!-- Devices List -->
        <div class="card">
          <div class="card-header">
            <h3><i class="bi bi-mic text-primary"></i> Trạng thái thiết bị Micro</h3>
            <a href="./thiet-bi.html" class="btn btn-outline btn-sm">Xem tất cả</a>
          </div>
          <div class="card-body" style="max-height:400px;overflow-y:auto;padding:0;">
            <table class="table" style="margin:0;">
              <thead>
                <tr>
                  <th>Thiết bị</th>
                  <th>Khu vực</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="dashboard-devices-tbody">
              </tbody>
            </table>
          </div>
        </div>

        <!-- Live Alert Feed -->
        <div class="card">
          <div class="card-header">
            <h3><i class="bi bi-bell-fill text-danger"></i> Cảnh báo mới nhất</h3>
            <a href="./canh-bao.html" class="btn btn-outline btn-sm">Xem tất cả</a>
          </div>
          <div class="card-body" style="max-height:400px;overflow-y:auto;">
            <div id="alert-feed"></div>
          </div>
        </div>
      </div>

      <!-- Hourly Trend Chart -->
      <div class="card" style="margin-top:20px;">
        <div class="card-header">
          <h3><i class="bi bi-graph-up text-success"></i> Xu hướng cảnh báo theo giờ hôm nay</h3>
        </div>
        <div class="card-body" style="height: 300px; position: relative;">
          <canvas id="hourly-chart"></canvas>
        </div>
      </div>

    </main>
  </div>

  <script src="./dung-chung.js?v=8"></script>
  <script src="./tong-quan.js?v=5"></script>
</body>
</html>
